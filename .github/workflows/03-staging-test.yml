name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Confirm staging deployment succeeded
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "02 - Deploy to Staging conclusion: $DEPLOY_CONCLUSION"

          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "Staging deployment did not succeed. Failing so production is not promoted."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Check all staging images share one commit tag
        run: |
          TAGS=$(kubectl get deployment \
            frontend user-service student-service \
            lecturer-service course-service enrollment-service \
            -n staging \
            -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | sed 's/.*://' | sort -u)

          echo "Image tags running in staging:"
          echo "$TAGS"

          if [ "$(printf '%s\n' "$TAGS" | grep -c .)" -ne 1 ]; then
            echo "Staging deployments do not share one image tag."
            exit 1
          fi

          if ! [[ "$TAGS" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Staging image tag is not a full commit SHA."
            exit 1
          fi

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

      - name: Test each backend through the frontend proxy
        run: |
          for SERVICE in users students lecturers courses enrollments; do
            BODY=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              "http://${FRONTEND_IP}/api/${SERVICE}/health")

            echo "/api/${SERVICE}/health -> ${BODY}"

            echo "$BODY" | grep -q '"status":"healthy"'
          done

      - name: Check for OOMKilled containers
        run: |
          kubectl get pods -n staging

          if kubectl get pods -n staging \
            -o jsonpath='{..lastState.terminated.reason}' \
            | grep -q OOMKilled; then
            echo "A staging container was OOMKilled."
            exit 1
          fi

      - name: Validate Prometheus is collecting staging metrics
        env:
          NAMESPACE: staging
          EXPECTED_DEPLOYMENTS: "11"
        run: |
          kubectl get pods -n monitoring

          kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090 > /dev/null 2>&1 &
          sleep 5

          query() {
            curl -s http://localhost:9090/api/v1/query --data-urlencode "query=$1" \
              | jq -r '.data.result[0].value[1] // "0"'
          }

          for i in {1..12}; do
            AVAILABLE=$(query "count(kube_deployment_status_replicas_available{namespace=\"$NAMESPACE\"} >= 1)")
            echo "Deployments with an available replica in $NAMESPACE, according to Prometheus: $AVAILABLE of $EXPECTED_DEPLOYMENTS"

            if [ "$AVAILABLE" = "$EXPECTED_DEPLOYMENTS" ]; then
              break
            fi

            sleep 10
          done

          if [ "$AVAILABLE" != "$EXPECTED_DEPLOYMENTS" ]; then
            echo "Prometheus does not show every $NAMESPACE deployment as available."
            exit 1
          fi

          DOWN=$(curl -s "http://localhost:9090/api/v1/targets?state=active" \
            | jq --arg ns "$NAMESPACE" '[.data.activeTargets[] | select(.labels.namespace == $ns and .health != "up")] | length')
          echo "Scrape targets in $NAMESPACE that are not up: $DOWN"

          if [ "$DOWN" -ne 0 ]; then
            exit 1
          fi

          APP_TARGET=$(query "up{namespace=\"$NAMESPACE\", job=\"student-service\"}")
          echo "student-service /metrics target up: $APP_TARGET"

          if [ "$APP_TARGET" != "1" ]; then
            echo "Prometheus is not scraping student-service application metrics."
            exit 1
          fi

          REQUESTS=$(query "sum(http_requests_total{namespace=\"$NAMESPACE\", job=\"student-service\"})")
          echo "student-service requests recorded by Prometheus: $REQUESTS"

          echo "Memory working set per pod in $NAMESPACE (MiB):"
          curl -s http://localhost:9090/api/v1/query \
            --data-urlencode "query=sum by (pod) (container_memory_working_set_bytes{namespace=\"$NAMESPACE\", container!=\"\"}) / 1048576" \
            | jq -r '.data.result[] | "\(.metric.pod) \(.value[1] | tonumber | floor)"'
