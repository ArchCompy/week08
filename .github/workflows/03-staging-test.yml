name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Confirm staging deployment succeeded
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "02 - Deploy to Staging conclusion: $DEPLOY_CONCLUSION"

          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "Staging deployment did not succeed. Failing so production is not promoted."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Check all staging images share one commit tag
        run: |
          TAGS=$(kubectl get deployment \
            frontend user-service student-service \
            lecturer-service course-service enrollment-service \
            -n staging \
            -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | sed 's/.*://' | sort -u)

          echo "Image tags running in staging:"
          echo "$TAGS"

          if [ "$(printf '%s\n' "$TAGS" | grep -c .)" -ne 1 ]; then
            echo "Staging deployments do not share one image tag."
            exit 1
          fi

          if ! [[ "$TAGS" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Staging image tag is not a full commit SHA."
            exit 1
          fi

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

      - name: Test each backend through the frontend proxy
        run: |
          for SERVICE in users students lecturers courses enrollments; do
            BODY=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              "http://${FRONTEND_IP}/api/${SERVICE}/health")

            echo "/api/${SERVICE}/health -> ${BODY}"

            echo "$BODY" | grep -q '"status":"healthy"'
          done

      - name: Check for OOMKilled containers
        run: |
          kubectl get pods -n staging

          if kubectl get pods -n staging \
            -o jsonpath='{..lastState.terminated.reason}' \
            | grep -q OOMKilled; then
            echo "A staging container was OOMKilled."
            exit 1
          fi
