name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main
    # Infrastructure and monitoring changes are handled by 00 - Infrastructure,
    # so they do not rebuild and redeploy the application.
    paths-ignore:
      - "infra/**"
      - "monitoring/**"
      - ".github/workflows/00-infrastructure.yml"

  # Run the tests on pull requests into main. Pull requests also build and
  # scan every image with Docker Scout, but nothing is pushed to ACR or deployed.
  pull_request:
    branches:
      - main
  
  # Manual trigger for the workflow
  workflow_dispatch:


permissions:
  contents: read
  id-token: write
  security-events: write

jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, scan with Docker Scout, then push Docker images
  # =========================================================
  build-and-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # All backend tests must pass before this job starts
    needs:
      - backend-test

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    env:
      IMAGE_REF: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_REF" \
            ./${{ matrix.service }}

      - name: Log in to Docker Hub (required by Docker Scout)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Gate: fixable critical and high vulnerabilities.
      # exit-code false reports without blocking; it is switched on after remediation.
      - name: Docker Scout gate (fixable critical and high)
        uses: docker/scout-action@v1.26.0
        with:
          command: cves
          image: local://${{ env.IMAGE_REF }}
          platform: linux/amd64
          only-severities: critical,high
          only-fixed: true
          exit-code: false
          write-comment: false

      - name: Docker Scout report for code scanning (all severities)
        uses: docker/scout-action@v1.26.0
        with:
          command: cves
          image: local://${{ env.IMAGE_REF }}
          platform: linux/amd64
          sarif-file: scout-${{ matrix.service }}.sarif
          summary: false
          write-comment: false

      - name: Upload Scout results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scout-${{ matrix.service }}.sarif
          category: docker-scout-${{ matrix.service }}

      # Push only from main (push or manual run). Pull requests stop after the scan.
      - name: Login to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Push Docker image with commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_REF"
