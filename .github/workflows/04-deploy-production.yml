name: 04 - Deploy to Production

on:
  # Continuous Deployment: run automatically when the staging tests finish
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

  # Manual fallback for re-deploying or rolling back to a known SHA
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    environment:
      name: production

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Resolve image tag to promote
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Trigger event: $EVENT_NAME"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            echo "Tag source: manual dispatch input"
          else
            TAGS=$(kubectl get deployment \
              frontend user-service student-service \
              lecturer-service course-service enrollment-service \
              -n staging \
              -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
              | sed 's/.*://' | sort -u)

            if [ "$(printf '%s\n' "$TAGS" | grep -c .)" -ne 1 ]; then
              echo "Staging deployments do not share one image tag:"
              echo "$TAGS"
              exit 1
            fi

            TAG="$TAGS"
            echo "Tag source: images running in staging after 03 passed"
            echo "workflow_run.head_sha, for comparison: $RUN_HEAD_SHA"
          fi

          if ! [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Not a full commit SHA: $TAG"
            exit 1
          fi

          echo "Promoting image tag: $TAG"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the promoted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.image_tag }}

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          STORAGE_CONNECTION_STRING=$(az storage account show-connection-string \
            --name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --query connectionString \
            -o tsv)
          echo "::add-mask::$STORAGE_CONNECTION_STRING"

          if [ -z "$STORAGE_CONNECTION_STRING" ]; then
            echo "Could not read the storage connection string."
            exit 1
          fi

          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="$STORAGE_CONNECTION_STRING" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ steps.tag.outputs.image_tag }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ steps.tag.outputs.image_tag }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ steps.tag.outputs.image_tag }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ steps.tag.outputs.image_tag }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ steps.tag.outputs.image_tag }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ steps.tag.outputs.image_tag }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Verify production runs the promoted tag
        env:
          EXPECTED_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          TAGS=$(kubectl get deployment \
            frontend user-service student-service \
            lecturer-service course-service enrollment-service \
            -n production \
            -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | sed 's/.*://' | sort -u)

          echo "Image tags running in production:"
          echo "$TAGS"

          if [ "$TAGS" != "$EXPECTED_TAG" ]; then
            echo "Production is not running the promoted tag $EXPECTED_TAG."
            exit 1
          fi

      - name: Wait for production frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n production \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              echo "Production frontend: http://$FRONTEND_IP"
              exit 0
            fi

            echo "Waiting for production frontend IP..."

            sleep 10
          done

          echo "Unable to find production frontend IP."
          exit 1

      - name: Verify production frontend and backends
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            "http://${FRONTEND_IP}/"

          echo "Production frontend returned 200"

          for SERVICE in users students lecturers courses enrollments; do
            BODY=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              "http://${FRONTEND_IP}/api/${SERVICE}/health")

            echo "/api/${SERVICE}/health -> ${BODY}"

            echo "$BODY" | grep -q '"status":"healthy"'
          done

      - name: Check for OOMKilled containers
        run: |
          if kubectl get pods -n production \
            -o jsonpath='{..lastState.terminated.reason}' \
            | grep -q OOMKilled; then
            echo "A production container was OOMKilled."
            exit 1
          fi

      - name: Validate Prometheus is collecting production metrics
        env:
          NAMESPACE: production
          EXPECTED_DEPLOYMENTS: "11"
        run: |
          kubectl get pods -n monitoring

          kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090 > /dev/null 2>&1 &
          sleep 5

          query() {
            curl -s http://localhost:9090/api/v1/query --data-urlencode "query=$1" \
              | jq -r '.data.result[0].value[1] // "0"'
          }

          for i in {1..12}; do
            AVAILABLE=$(query "count(kube_deployment_status_replicas_available{namespace=\"$NAMESPACE\"} >= 1)")
            echo "Deployments with an available replica in $NAMESPACE, according to Prometheus: $AVAILABLE of $EXPECTED_DEPLOYMENTS"

            if [ "$AVAILABLE" = "$EXPECTED_DEPLOYMENTS" ]; then
              break
            fi

            sleep 10
          done

          if [ "$AVAILABLE" != "$EXPECTED_DEPLOYMENTS" ]; then
            echo "Prometheus does not show every $NAMESPACE deployment as available."
            exit 1
          fi

          DOWN=$(curl -s "http://localhost:9090/api/v1/targets?state=active" \
            | jq --arg ns "$NAMESPACE" '[.data.activeTargets[] | select(.labels.namespace == $ns and .health != "up")] | length')
          echo "Scrape targets in $NAMESPACE that are not up: $DOWN"

          if [ "$DOWN" -ne 0 ]; then
            exit 1
          fi

          echo "Memory working set per pod in $NAMESPACE (MiB):"
          curl -s http://localhost:9090/api/v1/query \
            --data-urlencode "query=sum by (pod) (container_memory_working_set_bytes{namespace=\"$NAMESPACE\", container!=\"\"}) / 1048576" \
            | jq -r '.data.result[] | "\(.metric.pod) \(.value[1] | tonumber | floor)"'

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production
